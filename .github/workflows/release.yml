name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Create keystore
        run: |
          keytool -genkeypair -keystore $RUNNER_TEMP/ks.jks -storepass android123 -keypass android123 -alias k -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=PdfOcr"
          echo "KS_PATH=$RUNNER_TEMP/ks.jks" >> $GITHUB_ENV
      - run: gradle assembleRelease --no-daemon
      - run: cp app/build/outputs/apk/release/app-release.apk PDF-OCR.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: PDF OCR v1.0.${{ github.run_number }}
          files: PDF-OCR.apk
